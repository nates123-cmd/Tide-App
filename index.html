<style>
  :root {
    --bg: #EEF2F6;
    --text: #1A2230;
    --muted: #5C6878;
    --accent: #4A6B8A;
    --accent-soft: #7B97B5;
    --card-bg: #E2E8EF;
    --card-bg-warm: #D9E3EC;
    --border: #C5D0DB;
    --warn: #B5754A;
    --good: #6F8B82;
    --radius: 14px;
    --radius-lg: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); min-height: 100vh; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 18px 80px; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  h1 { font-size: 28px; }
  h2 { font-size: 20px; }
  h3 { font-size: 16px; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { font-family: inherit; font-size: 15px; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: var(--radius); background: var(--accent); color: white; font-weight: 500; min-height: 48px; transition: opacity 0.15s; width: 100%; }
  .btn:active { opacity: 0.85; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-soft { background: var(--card-bg); color: var(--text); }
  .btn-warm { background: var(--warn); color: white; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
  .card-warm { background: var(--card-bg-warm); }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { padding: 10px 8px; background: var(--card-bg); border-radius: var(--radius); text-align: center; font-size: 14px; cursor: pointer; transition: background 0.15s, color 0.15s; border: 1px solid transparent; }
  .chip:active, .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }

  header.app-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 18px; }

  .quote-meta { display: flex; gap: 12px; margin-top: 14px; }
  .quote-meta button { font-size: 13px; color: var(--muted); }

  .stat-big { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stats-row .card { margin-bottom: 0; padding: 14px 12px; text-align: center; }

  .pace-good { color: var(--good); }
  .pace-warn { color: var(--warn); }

  .drink-list { margin-top: 8px; }
  .drink-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .drink-item:first-child { border-top: none; }
  .drink-item .x { color: var(--muted); padding: 4px 8px; }

  .session-row { padding: 14px 0; border-top: 1px solid var(--border); }
  .session-row:first-child { border-top: none; padding-top: 0; }
  .session-row .row-top { display: flex; justify-content: space-between; font-size: 14px; }
  .session-row .row-bottom { font-size: 13px; color: var(--muted); margin-top: 4px; }

  textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: white; font-family: inherit; font-size: 15px; color: var(--text); resize: none; }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(28, 28, 28, 0.4); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s; }
  .modal { background: var(--bg); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: slideUp 0.22s ease; max-height: 88vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal h2 { margin-bottom: 16px; }
  .modal-section { margin-bottom: 18px; }
  .modal-section .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 18px; border-radius: 100px; font-size: 14px; z-index: 200; animation: fade 0.2s; max-width: 90%; }

  .pill { display: inline-block; padding: 3px 10px; background: var(--card-bg); border-radius: 100px; font-size: 12px; color: var(--muted); }
  .pill-warm { background: var(--warn); color: white; }
  .pill-good { background: var(--good); color: white; }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .em { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

  .quick-fab { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); width: 60px; height: 60px; border-radius: 50%; background: var(--accent); color: white; font-size: 28px; box-shadow: 0 4px 16px rgba(74, 107, 138, 0.35); display: flex; align-items: center; justify-content: center; z-index: 50; }

  .week-bar { display: flex; align-items: flex-end; gap: 6px; height: 80px; padding: 8px 0; }
  .week-bar .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; }
  .week-bar .bar-fill { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.3s; }

  .week-bar .bar-fill.future { background: var(--border); opacity: 0.5; }

  .key-form { padding: 40px 18px; }
  .key-form input { font-family: monospace; font-size: 13px; }

// ---------------------------------------------------------------------------
// Helpers

const $ = (sel) => document.querySelector(sel);
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

function getKey() { return localStorage.getItem('anthropic_api_key'); }
function setKey(k) { localStorage.setItem('anthropic_api_key', k); }

function toast(msg, ms = 2400) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function fmtDate(iso) {
  const d = new Date(iso);
  const today = new Date();
  const yest = new Date(); yest.setDate(yest.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
}

function fmtDuration(ms) {
  const min = Math.floor(ms / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

// ---------------------------------------------------------------------------
// Supabase fetch
// ---------------------------------------------------------------------------
async function sbFetch(path, opts = {}) {
  const url = path.startsWith('http') ? path : `${SB_URL}/rest/v1${path}`;
  const r = await fetch(url, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: opts.method === 'POST' ? 'return=representation' : (opts.method === 'PATCH' ? 'return=representation' : ''),
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Supabase ${r.status}: ${txt}`);
  }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

// ---------------------------------------------------------------------------
// Claude
// ---------------------------------------------------------------------------
async function callClaude(userPrompt, { system = null, maxTokens = 400 } = {}) {
  const key = getKey();
  if (!key) throw new Error('No API key set');
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: userPrompt }],
  };
  if (system) body.system = system;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`Claude ${r.status}: ${t.slice(0, 200)}`);
  }
  const data = await r.json();
  return (data.content || []).map(c => c.text || '').join('').trim();
}

async function callClaudeJSON(userPrompt, fallback) {
  try {
    const text = await callClaude(userPrompt, {
      system: 'You output ONLY valid JSON, no preamble or code fences. Be terse and grounded.',
    });
    const cleaned = text.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
    return JSON.parse(cleaned);
  } catch (e) {
    console.warn('Claude JSON failed, using fallback:', e.message);
    return fallback;
  }
}

// ---------------------------------------------------------------------------
// Standard drink units (US standard = 14g pure alcohol)
// ---------------------------------------------------------------------------
const DRINK_UNITS = {
  beer:     1.0,   // 12oz @ ~5%
  wine:     1.0,   // 5oz @ ~12%
  spirits:  1.0,   // 1.5oz @ ~40%
  cocktail: 1.4,   // varies; assume slightly stronger
};

const DRINK_LABELS = {
  beer:     'Beer',
  wine:     'Wine',
  spirits:  'Spirits',
  cocktail: 'Cocktail',
};

const SETTINGS = ['bar', 'restaurant', 'home', 'party', 'date', 'work event'];
const COMPANY  = ['solo', 'friends', 'date', 'family', 'work'];
const FEELINGS = ['great', 'good', 'okay', 'rough'];

// Intention is stored as the upper bound of the range (int).
// 99 = "12+" sentinel (no practical soft limit).
const INTENTION_RANGES = [
  { label: '1–3',  max: 3  },
  { label: '4–6',  max: 6  },
  { label: '7–10', max: 10 },
  { label: '12+',  max: 99 },
];
function intentionLabel(max) {
  if (max == null) return null;
  const r = INTENTION_RANGES.find(r => r.max === max);
  return r ? r.label : String(max);
}
function intentionHasLimit(max) {
  return max != null && max < 99;
}

// Real human quotes — curated, sourced. Tags steer contextual nudges.

// ---------------------------------------------------------------------------
// Pace logic
// ---------------------------------------------------------------------------
function computePace(drinks) {
  if (drinks.length === 0) return { perHour: 0, status: 'none', minSinceLast: null };
  const now = Date.now();
  const start = new Date(drinks[0].drink_at).getTime();
  const elapsedHr = Math.max((now - start) / 3600000, 0.25); // floor at 15min so we don't divide by tiny numbers
  const total = drinks.reduce((s, d) => s + (Number(d.standard_units) || 1), 0);
  const perHour = total / elapsedHr;
  const last = new Date(drinks[drinks.length - 1].drink_at).getTime();
  const minSinceLast = Math.floor((now - last) / 60000);
  let status = 'good';
  if (perHour >= 2.5) status = 'fast';
  else if (perHour >= 1.5) status = 'moderate';
  else status = 'easy';
  return { perHour, status, minSinceLast, total };
}

// ---------------------------------------------------------------------------
// Render — root
// ---------------------------------------------------------------------------
function render() {
  if (!getKey()) return renderKeyForm();
  const screen = state.screen || 'home';
  if (screen === 'home') renderHome();
  else if (screen === 'history') renderHistory();
  else if (screen === 'morning') renderMorning(state.morningSession);
}

}

// ---------------------------------------------------------------------------
// Home screen
// ---------------------------------------------------------------------------
function renderHome() {
  const hasSession = !!state.activeSession;
  const pace = hasSession ? computePace(state.drinks) : null;

        ? `<div class="quote">${escapeHtml(state.currentQuote.q)}</div>
           <div class="quote-author">— ${escapeHtml(state.currentQuote.a)}</div>`
        : '<div class="quote"><span class="muted">…</span></div>'}

        <button id="quote-new">New quote</button>
        <button id="quote-dismiss">Dismiss</button>
      </div>
    </div>

    ${hasSession ? renderDrinkList() : renderWeekSummary()}

    ${hasSession ? `<button class="quick-fab" id="quick-add" aria-label="Log drink">+</button>` : ''}
  `;

  // Wire events
  $$('[data-nav]').forEach(b => b.onclick = () => { state.screen = b.dataset.nav; render(); });
  $('#quote-new').onclick = () => loadQuote(true);
  $('#quote-dismiss').onclick = dismissQuote;

  if (hasSession) {
    $('#quick-add').onclick = openLogDrink;
    $('#end-session').onclick = openEndSession;
  } else {

  }

  // Schedule pace re-render every minute
  if (state.paceTimer) clearInterval(state.paceTimer);
  if (hasSession) {
    state.paceTimer = setInterval(() => {

}

const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function renderIdleCard() {
  const last = state.history[0];
  return `
    <div class="card">
      <h2>No session in progress</h2>
      <p>Set an intention, then track your night.</p>
      <button class="btn" id="start-session">Start a session</button>
      ${last ? `<p class="small" style="margin-top: 14px; margin-bottom: 0">Last: ${fmtDate(last.started_at)} — ${last.drink_count || 0} ${last.drink_count === 1 ? 'drink' : 'drinks'}${last.feeling ? `, felt ${last.feeling}` : ''}</p>` : ''}
    </div>
  `;
}

function renderActiveSessionCard(pace, elapsed) {
  const intention = state.activeSession.intention;
  const count = state.drinks.length;
  const hasLimit = intentionHasLimit(intention);
  const overLimit = hasLimit && count > intention;
  const label = intentionLabel(intention);
  const paceClass = pace.status === 'fast' ? 'pace-warn' : (pace.status === 'easy' ? 'pace-good' : '');
  const paceText = pace.status === 'fast' ? 'Pacing fast' : (pace.status === 'easy' ? 'Easy pace' : 'Moderate pace');

  return `
    <div class="card">
      <div class="row" style="margin-bottom: 14px">
        <div class="stack">
          <div class="muted small">${escapeHtml(state.activeSession.setting || '')}${state.activeSession.who_with ? ' · ' + escapeHtml(state.activeSession.who_with) : ''}</div>
          <div style="font-weight: 500">Session — ${fmtDuration(elapsed)}</div>
        </div>
        ${overLimit ? '<span class="pill pill-warm">past range</span>' : label ? `<span class="pill">aim ${label}</span>` : ''}
      </div>

      <div class="stats-row">
        <div class="card">
          <div class="stat-big">${count}</div>
          <div class="stat-label">drinks</div>
        </div>
        <div class="card">
          <div class="stat-big ${paceClass}">${pace.perHour ? pace.perHour.toFixed(1) : '0'}</div>
          <div class="stat-label">/hour</div>
        </div>
        <div class="card">
          <div class="stat-big">${pace.minSinceLast == null ? '—' : pace.minSinceLast + 'm'}</div>
          <div class="stat-label">since last</div>
        </div>
      </div>

      <div class="small ${paceClass}" style="text-align: center; margin-top: 12px">${paceText}</div>

      <div style="height: 14px"></div>
      <div class="btn-row">
        <button class="btn btn-soft" id="end-session">End session</button>
        <button class="btn" id="log-drink-inline" onclick="openLogDrink()">+ Drink</button>
      </div>
    </div>
  `;
}

// Compute weekly stats from history (calendar week starting Sunday)
function renderWeekSummary() {
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay()); // getDay: Sun=0
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  const isFuture = days.map(d => d > today);
  const dayCounts = days.map((d, i) => {
    if (isFuture[i]) return 0;
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const sessions = state.history.filter(s => {
      const sd = new Date(s.started_at);
      return sd >= d && sd < next;
    });
    return sessions.reduce((sum, s) => sum + (s.drink_count || 0), 0);
  });
  const max = Math.max(1, ...dayCounts);
  const total = dayCounts.reduce((a, b) => a + b, 0);
  const noDrinkDays = dayCounts.filter((c, i) => !isFuture[i] && c === 0).length;

  return `
    <div class="card">
      <h3>This week</h3>
      <div class="week-bar">
        ${dayCounts.map((c, i) => {
          const future = isFuture[i];
          const cls = future ? 'future' : (c === 0 ? 'zero' : '');
          const h = future ? 2 : (c === 0 ? 4 : Math.round(c / max * 70));
          return `
            <div class="bar">
              <div class="bar-fill ${cls}" style="height: ${h}px"></div>
              <div class="bar-label${future ? ' future' : ''}">${'SMTWTFS'[days[i].getDay()]}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="row small muted" style="margin-top: 6px">
        <div>${total} ${total === 1 ? 'drink' : 'drinks'} this week</div>
        ${noDrinkDays > 0 ? `<div class="pill pill-good">${noDrinkDays} low/no-drink ${noDrinkDays === 1 ? 'night' : 'nights'}</div>` : ''}
      </div>
    </div>
  `;
}

function showModal(innerHtml, afterInsert) {
  closeModal();

}

// ---------------------------------------------------------------------------
// Quotes — real human quotes, rotated locally. No AI generation.
// ---------------------------------------------------------------------------
function pickQuote({ preferTags = null } = {}) {
  const dismissedSet = new Set((state.dismissedQuotes || []).slice(-30));
  const currentQ = state.currentQuote ? state.currentQuote.q : null;
  const excludeQs = new Set([currentQ]);

  let pool = QUOTES.filter(x => !excludeQs.has(x.q) && !dismissedSet.has(x.q));
  if (preferTags) {
    const tagged = pool.filter(x => x.tags && x.tags.some(t => preferTags.includes(t)));
    if (tagged.length) pool = tagged;
  }
  if (pool.length === 0) {
    pool = QUOTES.filter(x => !excludeQs.has(x.q) && !dismissedSet.has(x.q));
  }
  if (pool.length === 0) {
    pool = QUOTES.filter(x => !excludeQs.has(x.q));
  }
  if (pool.length === 0) pool = QUOTES;
  return pool[Math.floor(Math.random() * pool.length)];
}

function loadQuote(force = false) {
  if (!force && state.currentQuote) return;
  state.currentQuote = pickQuote();
  if (state.screen === 'home') render();
}

async function dismissQuote() {
  if (!state.currentQuote) return;
  const dismissed = state.currentQuote.q;
  state.dismissedQuotes.push(dismissed);
  saveLocal();
  try {
    await sbFetch('/tide_dismissed_quotes', {
      method: 'POST',
      body: JSON.stringify({ quote: dismissed }),
    });
  } catch (e) { /* non-fatal */ }
  state.currentQuote = pickQuote();
  render();
}

function maybeNudge(kind) {
  const tags = kind === 'fast-pace' ? ['presence'] : ['presence', 'company'];
  state.currentQuote = pickQuote({ preferTags: tags });
  render();
}

// ---------------------------------------------------------------------------
// Local persistence (for offline-friendly active session reload)
// ---------------------------------------------------------------------------
function saveLocal() {
  localStorage.setItem('tide_state', JSON.stringify({
    activeSession: state.activeSession,
    drinks: state.drinks,
    dismissedQuotes: state.dismissedQuotes.slice(-50),
  }));
}
function loadLocal() {
  try {
    const raw = localStorage.getItem('tide_state');
    if (!raw) return;
    const s = JSON.parse(raw);
    state.activeSession = s.activeSession || null;
    state.drinks = s.drinks || [];
    state.dismissedQuotes = s.dismissedQuotes || [];
  } catch {}
}

// ---------------------------------------------------------------------------
// Data load
// ---------------------------------------------------------------------------
async function loadActiveSession() {
  // Server source of truth: last session with no ended_at
  try {
    const sessions = await sbFetch('/tide_sessions?ended_at=is.null&order=started_at.desc&limit=1');
    if (sessions && sessions.length) {
      state.activeSession = sessions[0];
      const drinks = await sbFetch(`/tide_drinks?session_id=eq.${sessions[0].id}&order=drink_at.asc`);
      state.drinks = drinks || [];
    } else {
      state.activeSession = null;
      state.drinks = [];
    }
    saveLocal();
  } catch (e) {
    console.warn('loadActiveSession failed, using local:', e.message);
    loadLocal();
  }
}

async function loadHistory() {
  try {
    // Pull last 30 sessions with drink counts (computed via two queries — keep it simple)
    const sessions = await sbFetch('/tide_sessions?order=started_at.desc&limit=30');
    if (!sessions) { state.history = []; return; }
    // Get drink counts in one query and merge
    const ids = sessions.map(s => s.id);
    let drinks = [];
    if (ids.length) {
      drinks = await sbFetch(`/tide_drinks?session_id=in.(${ids.join(',')})&select=session_id`) || [];
    }
    const counts = {};
    drinks.forEach(d => { counts[d.session_id] = (counts[d.session_id] || 0) + 1; });

    // Fetch existing morning reflections to know what's already done
    const refls = await sbFetch(`/tide_reflections?session_id=in.(${ids.join(',')})&select=session_id`) || [];
    const reflected = new Set(refls.map(r => r.session_id));

    state.history = sessions
      .filter(s => s.ended_at) // exclude active
      .map(s => {
        const sessionDate = new Date(s.started_at);
        const hoursAgo = (Date.now() - sessionDate.getTime()) / 3600000;
        const morningWindow = hoursAgo >= 6 && hoursAgo <= 36 && !reflected.has(s.id);
        return { ...s, drink_count: counts[s.id] || 0, morning_pending: morningWindow };
      });
  } catch (e) {
    console.warn('loadHistory failed:', e.message);
    state.history = [];
  }
}

async function boot() {
  if (!getKey()) { renderKeyForm(); return; }
  loadLocal();
  // Render fast from local cache
  state.screen = 'home';
  render();
  // Then refresh from server
  await loadActiveSession();
  await loadHistory();
  // Auto-prompt morning-after if there's a recently-ended session pending
  const pending = state.history.find(s => s.morning_pending);
  if (pending && !state.activeSession && !sessionStorage.getItem('morning_dismissed_' + pending.id)) {
    sessionStorage.setItem('morning_dismissed_' + pending.id, '1');
    state.morningSession = pending;
    state.screen = 'morning';
    renderMorning(pending);
    return;
  }
  render();
  loadQuote();
}

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}

window.openLogDrink = openLogDrink;

boot();
</script>
</body>
</html>
