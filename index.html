<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A89880">
<title>Tide</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tide">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #F5F2EE;
    --text: #1C1C1C;
    --muted: #6B6560;
    --muted-soft: #8E8884;
    --accent: #A89880;
    --accent-deep: #8C7A60;
    --accent-soft: #C5B89E;
    --card-bg: #EDEBE7;
    --card-bg-warm: #EFE9E0;
    --border: #D8D4CE;
    --border-soft: #E3DFD9;
    --warn: #B5754A;
    --good: #7A8B6F;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-lg: 20px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); min-height: 100vh; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 18px calc(96px + env(safe-area-inset-bottom)); }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  h1 { font-size: 28px; }
  h2 { font-size: 20px; }
  h3 { font-size: 16px; }
  .font-display { font-family: var(--font-display); }
  .font-body { font-family: var(--font-body); }
  .label-up { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .label-up-soft { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-soft); font-weight: 500; }
  .em-accent { font-family: var(--font-display); font-style: italic; color: var(--accent-deep); }
  .tnum { font-variant-numeric: tabular-nums; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { font-family: inherit; font-size: 15px; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: var(--radius); background: var(--accent); color: white; font-weight: 500; min-height: 48px; transition: opacity 0.15s; width: 100%; }
  .btn:active { opacity: 0.85; }
  .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-soft { background: var(--card-bg); color: var(--text); }
  .btn-warm { background: var(--warn); color: white; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }
  .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px; }
  .card-warm { background: var(--card-bg-warm); }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { padding: 10px 8px; background: var(--card-bg); border-radius: var(--radius); text-align: center; font-size: 14px; cursor: pointer; transition: background 0.15s, color 0.15s; border: 1px solid transparent; }
  .chip:active, .chip.selected { background: var(--accent); color: white; border-color: var(--accent); }
  .chip-soft.selected { background: var(--accent-soft); }
  header.app-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 18px; }
  header.app-head .title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header.app-head .nav-btn { padding: 8px 12px; border-radius: 10px; background: var(--card-bg); font-size: 14px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fade 0.2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .quote { font-style: italic; font-size: 16px; line-height: 1.55; color: var(--text); padding: 4px 0; }
  .quote-author { font-size: 13px; color: var(--muted); margin-top: 8px; letter-spacing: 0.02em; }
  .quote-meta { display: flex; gap: 12px; margin-top: 14px; }
  .quote-meta button { font-size: 13px; color: var(--muted); }

  .stat-big { font-size: 36px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stats-row.stats-4 { grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stats-row.stats-4 .stat-big { font-size: 26px; }
  .stats-row.stats-4 .card { padding: 12px 6px; }
  .stats-row .card { margin-bottom: 0; padding: 14px 12px; text-align: center; }

  .pace-good { color: var(--good); }
  .pace-warn { color: var(--warn); }

  .drink-list { margin-top: 8px; }
  .drink-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .drink-item:first-child { border-top: none; }
  .drink-item .x { color: var(--muted); padding: 4px 8px; }

  .session-row { padding: 14px 0; border-top: 1px solid var(--border); }
  .session-row:first-child { border-top: none; padding-top: 0; }
  .session-row .row-top { display: flex; justify-content: space-between; font-size: 14px; }
  .session-row .row-bottom { font-size: 13px; color: var(--muted); margin-top: 4px; }

  textarea, input[type="text"], input[type="number"] { width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: white; font-family: inherit; font-size: 15px; color: var(--text); resize: none; }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(28, 28, 28, 0.4); z-index: 100; display: flex; align-items: flex-end; justify-content: center; animation: fade 0.18s; }
  .modal { background: var(--bg); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); animation: slideUp 0.22s ease; max-height: 88vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
  .modal h2 { margin-bottom: 16px; }
  .modal-section { margin-bottom: 18px; }
  .modal-section .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: white; padding: 12px 18px; border-radius: 100px; font-size: 14px; z-index: 200; animation: fade 0.2s; max-width: 90%; }

  .pill { display: inline-block; padding: 3px 10px; background: var(--card-bg); border-radius: 100px; font-size: 12px; color: var(--muted); }
  .pill-warm { background: var(--warn); color: white; }
  .pill-good { background: var(--good); color: white; }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty .em { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }

  .quick-fab { position: fixed; bottom: calc(88px + env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: white; font-size: 26px; box-shadow: 0 4px 16px rgba(140, 122, 96, 0.35); display: flex; align-items: center; justify-content: center; z-index: 50; }

  .tab-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--card-bg); padding: 4px; border-radius: var(--radius); margin-bottom: 14px; }
  .tab-strip .tab { padding: 10px 6px; text-align: center; font-size: 13px; color: var(--muted); border-radius: 10px; cursor: pointer; transition: background 0.15s, color 0.15s; min-height: 40px; display: flex; align-items: center; justify-content: center; }
  .tab-strip .tab.active { background: var(--bg); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }

  .goal-bar { height: 6px; background: var(--card-bg); border-radius: 100px; overflow: hidden; margin-top: 10px; position: relative; }
  .goal-bar .fill { height: 100%; background: var(--accent); border-radius: 100px; transition: width 0.3s; }
  .goal-bar .fill.met { background: var(--good); }
  .goal-bar .fill.behind { background: var(--warn); }
  .goal-bar .pace-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: 0.45; border-radius: 2px; transform: translateX(-1px); }
  .water-chip-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .intake-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .intake-item:first-child { border-top: none; }
  .intake-item .x { color: var(--muted); padding: 4px 8px; }


  .week-bar { display: flex; align-items: flex-end; gap: 6px; height: 80px; padding: 8px 0; }
  .week-bar .bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; justify-content: flex-end; }
  .week-bar .bar-fill { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; transition: height 0.3s; }
  .week-bar .bar-fill.zero { background: var(--good); opacity: 0.4; height: 4px; }
  .week-bar .bar-fill.future { background: var(--border); opacity: 0.5; }
  .week-bar .bar-label { font-size: 11px; color: var(--muted); }
  .week-bar .bar-label.future { opacity: 0.45; }

  .key-form { padding: 40px 18px; }
  .key-form input { font-family: monospace; font-size: 13px; }

  /* ───── v2: Pulse home (mockup-matched) ───── */
  .pulse-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 24px; gap: 12px; }
  .pulse-head .brand { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.02em; line-height: 1; cursor: pointer; }
  .pulse-head .date { font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  .pulse-head .header-links { display: flex; gap: 16px; align-self: flex-start; margin-top: 10px; }
  .pulse-head .header-link { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.01em; cursor: pointer; }
  .pulse-head .header-link:active { color: var(--text); }

  .stat-grid {
    background: var(--card-bg);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background-color: var(--border-soft);
  }
  .stat-cell {
    background: var(--card-bg);
    padding: 18px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
  }
  .stat-cell:nth-child(1) { border-top-left-radius: 11px; }
  .stat-cell:nth-child(2) { border-top-right-radius: 11px; }
  .stat-cell:nth-child(3) { border-bottom-left-radius: 11px; }
  .stat-cell:nth-child(4) { border-bottom-right-radius: 11px; }
  .stat-label { font-family: var(--font-body); font-size: 10px; font-weight: 500; color: var(--muted-soft); letter-spacing: 0.14em; text-transform: uppercase; }
  .stat-value {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 34px;
    letter-spacing: -0.02em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .stat-value.dim { color: var(--muted); font-weight: 400; }
  .stat-unit { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .stat-delta { font-family: var(--font-body); font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .stat-delta.up { color: var(--good); }
  .stat-delta.down { color: var(--warn); }
  .stat-delta.flat { color: var(--muted); }
  .stat-delta.warn { color: var(--warn); }
  /* Readiness dot precedes the value via ::before */
  .stat-cell.readiness-good .stat-value::before,
  .stat-cell.readiness-amber .stat-value::before,
  .stat-cell.readiness-warn .stat-value::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 8px;
    align-self: center;
  }
  .stat-cell.readiness-good .stat-value::before  { background: var(--good); }
  .stat-cell.readiness-amber .stat-value::before { background: var(--accent); }
  .stat-cell.readiness-warn .stat-value::before  { background: var(--warn); }

  .pulse-card { background: var(--card-bg-warm); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 22px 20px 18px; margin-bottom: 14px; }
  .pulse-interp { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: 1.35; letter-spacing: -0.005em; color: var(--text); margin-bottom: 18px; }
  .pulse-interp em { font-style: italic; color: var(--accent-deep); }
  .pulse-loading { font-family: var(--font-display); font-style: italic; font-size: 17px; color: var(--muted); }
  .pulse-action {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .pulse-action:active { opacity: 0.88; }
  .pulse-action .arrow { font-size: 18px; line-height: 1; }

  .digest-card { background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; transition: background 0.15s; }
  .digest-card:active { background: var(--card-bg-warm); }
  .digest-content { flex: 1; min-width: 0; }
  .digest-tag { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-soft); margin-bottom: 5px; }
  .digest-headline { font-family: var(--font-display); font-weight: 400; font-size: 14px; line-height: 1.35; color: var(--text); letter-spacing: -0.005em; }
  .digest-headline em { font-style: italic; color: var(--accent-deep); }
  .digest-chevron { font-size: 18px; color: var(--muted); font-weight: 400; flex-shrink: 0; }
  .digest-card.dim { opacity: 0.7; }

  /* ───── v2: Reflection prompt (dashed soft card on Pulse home) ───── */
  .reflect-prompt {
    background: var(--card-bg-warm);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    margin-bottom: 14px;
    position: relative;
  }
  .reflect-prompt-dismiss {
    position: absolute;
    top: 12px; right: 12px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--border-soft);
    background: transparent;
    color: var(--muted-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }
  .reflect-prompt-dismiss:active { color: var(--text); border-color: var(--muted); }
  .reflect-prompt-eyebrow {
    font-family: var(--font-body);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted-soft);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .reflect-prompt-text {
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 400;
    font-size: 16px;
    line-height: 1.4;
    color: var(--accent-deep);
    letter-spacing: -0.005em;
    margin-bottom: 14px;
    padding-right: 32px;
  }
  .reflect-prompt-actions { display: flex; gap: 8px; }
  .reflect-btn {
    padding: 9px 16px;
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    border: none;
  }
  .reflect-btn.primary { background: var(--text); color: var(--bg); }
  .reflect-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .reflect-btn.ghost:active { color: var(--text); border-color: var(--muted); }

  /* ───── v2: Tab header (used on Indulge; will extend to other tabs in later chunks) ───── */
  .tab-head { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 4px 20px; gap: 12px; }
  .tab-head .tab-title { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.02em; line-height: 1; }
  .tab-head .tab-sub { font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; margin-top: 6px; }
  .tab-head .head-link { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.01em; align-self: flex-start; margin-top: 10px; cursor: pointer; }
  .tab-head .head-link:active { color: var(--text); }

  /* ───── v2: Indulge empty state (mockup-matched) ───── */
  .empty-eyebrow { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted-soft); font-weight: 600; margin-bottom: 8px; }
  .empty-prompt { font-family: var(--font-display); font-weight: 500; font-size: 22px; line-height: 1.25; letter-spacing: -0.015em; margin-bottom: 6px; }
  .empty-sub { font-family: var(--font-display); font-weight: 400; font-style: italic; font-size: 14px; line-height: 1.45; color: var(--muted); letter-spacing: -0.005em; margin-bottom: 18px; }

  .form-card { background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 20px 20px 18px; margin-bottom: 14px; }
  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-label { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-soft); font-weight: 500; margin-bottom: 8px; }
  .form-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: var(--font-display); font-size: 15px; font-weight: 400; color: var(--text); letter-spacing: -0.005em; outline: none; line-height: 1.4; }
  .form-input::placeholder { color: var(--muted-soft); font-style: italic; }
  .form-input:focus { border-color: var(--text); }
  .form-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .form-chip { padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.01em; cursor: pointer; }
  .form-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  .primary-btn { width: 100%; padding: 14px 18px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; font-weight: 500; letter-spacing: 0.01em; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: opacity 0.15s; }
  .primary-btn:active { opacity: 0.88; }
  .primary-btn .arrow { font-size: 18px; }

  .section-label { font-family: var(--font-body); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted-soft); font-weight: 500; margin: 12px 2px 10px; }
  .past-row { background: var(--card-bg); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 13px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
  .past-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
  .past-title { font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: -0.005em; line-height: 1.2; }
  .past-meta { font-family: var(--font-body); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  .past-right { text-align: right; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
  .past-units { font-family: var(--font-display); font-weight: 500; font-size: 16px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.005em; }

  if (min < 1) return 'just now';
  if (min < 60) return `${min}m`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

// Supabase fetch
// ---------------------------------------------------------------------------
async function sbFetch(path, opts = {}) {
  const url = path.startsWith('http') ? path : `${SB_URL}/rest/v1${path}`;
  const r = await fetch(url, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: opts.method === 'POST' ? 'return=representation' : (opts.method === 'PATCH' ? 'return=representation' : ''),
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Supabase ${r.status}: ${txt}`);
  }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function callClaude(userPrompt, { system = null, maxTokens = 400 } = {}) {
  const key = getKey();
  if (!key) throw new Error('No API key set');
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: userPrompt }],
  };
  if (system) body.system = system;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`Claude ${r.status}: ${t.slice(0, 200)}`);
  }
  const data = await r.json();
  return (data.content || []).map(c => c.text || '').join('').trim();
}

async function callClaudeJSON(userPrompt, fallback) {
  try {
    const text = await callClaude(userPrompt, {
      system: 'You output ONLY valid JSON, no preamble or code fences. Be terse and grounded.',
    });
    const cleaned = text.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
    return JSON.parse(cleaned);
  } catch (e) {
    console.warn('Claude JSON failed, using fallback:', e.message);
    return fallback;
  }
}

// Oura biometric pull. Shares PAT + edge fn with Still (same origin → same localStorage).
// Sleep for night ending on day D is reported as Oura's daily_sleep row with day=D.
// We sync periodically into tide_oura_daily so the Patterns view can join with drinking data.
// ---------------------------------------------------------------------------
const OURA_PROXY_PATH = '/functions/v1/smooth-processor';
const OURA_SYNC_MS = 4 * 60 * 60 * 1000;

function getOuraPat() { return localStorage.getItem('still_oura_pat') || ''; }
function setOuraPat(v) { localStorage.setItem('still_oura_pat', (v || '').trim()); }

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}

async function ouraFetch(path, startDate, endDate) {
  const pat = getOuraPat();
  if (!pat) throw new Error('Oura PAT not set');
  const u = new URL(SB_URL + OURA_PROXY_PATH);
  u.searchParams.set('path', path);
  if (startDate) u.searchParams.set('start_date', startDate);
  if (endDate) u.searchParams.set('end_date', endDate);
  const r = await fetch(u.toString(), { headers: { 'x-oura-pat': pat } });
  if (!r.ok) {
    let detail = '';
    try { detail = (await r.json()).error || ''; } catch {}
    throw new Error('Oura ' + r.status + (detail ? ' — ' + detail : ''));
  }
  return r.json();
}

// Build one tide_oura_daily row from same-day Oura sleep+readiness+activity records.
function normalizeOuraRow(date, sleepRow, readinessRow, activityRow) {
  const totalSec = sleepRow?.total_sleep_duration ?? null;
  const remSec   = sleepRow?.rem_sleep_duration ?? null;
  const deepSec  = sleepRow?.deep_sleep_duration ?? null;
  return {
    date,
    sleep_score:      sleepRow?.score ?? null,
    total_sleep_min:  totalSec != null ? Math.round(totalSec / 60) : null,
    rem_sleep_min:    remSec   != null ? Math.round(remSec   / 60) : null,
    deep_sleep_min:   deepSec  != null ? Math.round(deepSec  / 60) : null,
    sleep_efficiency: sleepRow?.sleep_efficiency ?? sleepRow?.contributors?.efficiency ?? null,
    hrv_avg:          readinessRow?.contributors?.hrv_balance ?? null,
    resting_hr:       readinessRow?.contributors?.resting_heart_rate ?? null,
    readiness_score:  readinessRow?.score ?? null,
    activity_score:   activityRow?.score ?? null,
    raw: { sleep: sleepRow || null, readiness: readinessRow || null, activity: activityRow || null },
    fetched_at: new Date().toISOString(),
  };
}

async function syncOura({ days = 14, force = false } = {}) {
  if (!getOuraPat()) return { ok: false, skipped: 'no_pat' };
  const lastSync = parseInt(localStorage.getItem('tide_oura_last_sync') || '0', 10);
  if (!force && Date.now() - lastSync < OURA_SYNC_MS) return { ok: true, skipped: 'recent' };
  const endDate = todayISO();
  const startDate = addDays(endDate, -(days - 1));
  try {
    const [sleepRes, readinessRes, activityRes] = await Promise.all([
      ouraFetch('daily_sleep', startDate, endDate).catch(() => null),
      ouraFetch('daily_readiness', startDate, endDate).catch(() => null),
      ouraFetch('daily_activity', startDate, endDate).catch(() => null),
    ]);
    const byDate = (res) => Object.fromEntries((res?.data || []).map(r => [r.day, r]));
    const sleepByDate     = byDate(sleepRes);
    const readinessByDate = byDate(readinessRes);
    const activityByDate  = byDate(activityRes);
    const dates = new Set([
      ...Object.keys(sleepByDate),
      ...Object.keys(readinessByDate),
      ...Object.keys(activityByDate),
    ]);
    if (!dates.size) {
      localStorage.setItem('tide_oura_last_sync', String(Date.now()));
      return { ok: true, count: 0 };
    }
    const rows = [...dates].map(d => normalizeOuraRow(d, sleepByDate[d], readinessByDate[d], activityByDate[d]));
    await sbFetch('/tide_oura_daily?on_conflict=date', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify(rows),
    });
    localStorage.setItem('tide_oura_last_sync', String(Date.now()));
    return { ok: true, count: rows.length };
  } catch (e) {
    console.warn('Oura sync failed:', e.message);
    return { ok: false, error: e.message };
  }
}

function average(arr) {
  const vals = arr.filter(v => v != null && Number.isFinite(v));
  if (!vals.length) return null;
  return vals.reduce((s, v) => s + v, 0) / vals.length;
}

function hydrationStats(now = new Date()) {
  const target = waterPaceTarget(now);
  const actualMl = (state.todayIntake || [])
    .filter(r => r.category === 'water')
    .reduce((s, r) => s + (Number(r.quantity) || 0), 0);
  const delta = actualMl - target;
  let status;
  if (target === 0) status = 'idle';
  else if (delta > 200) status = 'ahead';
  else if (delta < -300) status = 'behind';
  else status = 'on-pace';
  return { actualMl, target, delta, status, goal: WATER_GOAL_ML };
}

function readinessBand(score) {
  if (score == null) return 'flat';
  if (score >= 80) return 'good';
  if (score >= 65) return 'accent';
  return 'warn';
}

function formatDelta(curr, avg, suffix = '') {
  if (curr == null || avg == null) return '';
  const d = curr - avg;
  if (Math.abs(d) < 1) return `<span class="delta-flat">flat vs 7d</span>`;
  const sign = d > 0 ? '+' : '';
  const cls = d > 0 ? 'delta-up' : 'delta-down';
  return `<span class="${cls}">${sign}${Math.round(d)}${suffix} vs 7d</span>`;
}

function formatSleepDelta(currMin, avgMin) {
  if (currMin == null || avgMin == null) return '';
  const d = currMin - avgMin;
  if (Math.abs(d) < 6) return `<span class="delta-flat">flat vs 7d</span>`;
  const sign = d > 0 ? '+' : '−';
  const cls = d > 0 ? 'delta-up' : 'delta-down';
  const mins = Math.abs(d);
  const lbl = mins >= 60 ? `${Math.floor(mins/60)}h${mins%60 ? ' ' + (mins%60) + 'm' : ''}` : `${mins}m`;
  return `<span class="${cls}">${sign}${lbl} vs 7d</span>`;
}

// Returns one of:
//   { label, target: { screen?, tab?, openLog?, fab? } }
// Highest-priority rule fires first.
function computePulseAction() {
  const o   = state.ouraToday || {};
  const hyd = hydrationStats();
  const readiness = o.readiness_score;
  const now = new Date();
  const hour = now.getHours();
  const dayOfWeek = now.getDay(); // 0 Sun … 6 Sat
  const todayCaff = (state.todayIntake || []).filter(r => r.category === 'caffeine');
  const lastCaff = todayCaff.length ? new Date(todayCaff[todayCaff.length - 1].logged_at) : null;
  const lastCaffHour = lastCaff ? lastCaff.getHours() + lastCaff.getMinutes() / 60 : null;
  const hasActiveSession = !!state.activeSession;
  const recentIndulge = (state.history || []).some(s => {
    const days = (Date.now() - new Date(s.started_at).getTime()) / 86400000;
    return days < 7;
  });
  // Morning stack heuristic: any supplement check-offs logged today
  const tookMorningStack = (state.todayIntake || []).some(r => r.category === 'supplement');
  // Workout logged today (tide_activities doesn't exist yet — placeholder false)
  const workoutLogged = false;

  // 1. Recovery override
  if (readiness != null && readiness < 65) {
    return { label: 'Mark a recovery day', target: { fab: true } };
  }
  // 2. Hydration deficit
  if (hyd.status === 'behind' && hyd.delta < -300) {
    return { label: 'Log a glass', target: { tab: 'water' } };
  }
  // 3. Active session
  if (hasActiveSession) {
    return { label: "Open tonight's session", target: { tab: 'drinks' } };
  }
  // 4. Caffeine late
  if (lastCaffHour != null && lastCaffHour >= 14) {
    return { label: 'Note caffeine time', target: { tab: 'water' } };
  }
  // 5. Indulge intention (Fri/Sat after 4pm, indulge active last 7d)
  if ((dayOfWeek === 5 || dayOfWeek === 6) && hour >= 16 && recentIndulge) {
    return { label: "Set tonight's intention", target: { tab: 'drinks' } };
  }
  // 6. Morning stack unchecked past 10am
  if (hour >= 10 && !tookMorningStack) {
    return { label: 'Mark morning stack', target: { tab: 'supplements' } };
  }
  // 7. Training opportunity (high readiness, no workout logged by 4pm) — placeholder until Train tab
  if (readiness != null && readiness > 80 && hour >= 16 && !workoutLogged) {
    return { label: 'Log workout', target: { fab: true } };
  }
  // 8. Default
  const defaultTab = state.tab || 'water';
  return { label: 'Log what you have had', target: { tab: defaultTab } };
}

async function generatePulse() {
  const o = state.ouraToday || {};
  const hyd = hydrationStats();
  const todayCaff = (state.todayIntake || []).filter(r => r.category === 'caffeine');
  const caffMg = todayCaff.reduce((s, r) => s + (Number(r.quantity) || 0), 0);
  const lastIndulge = (state.history || [])[0] || null;
  const lastDrinkCount = lastIndulge ? (lastIndulge.drink_count || 0) : null;
  const lastFeeling = lastIndulge ? lastIndulge.feeling : null;

  const haveOura = o.readiness_score != null || o.sleep_score != null || o.hrv_avg != null;
  if (!haveOura) {
    const fallback = 'Not enough signal today — log as you go.';
    setCachedPulse(fallback);
    return fallback;
  }

  const ctx = {
    readiness: o.readiness_score,
    sleep_score: o.sleep_score,
    sleep_min: o.total_sleep_min,
    hrv: o.hrv_avg,
    activity_score: o.activity_score,
    hydration_actual_ml: hyd.actualMl,
    hydration_expected_ml: hyd.target,
    caffeine_mg: caffMg,
    last_indulge_drinks: lastDrinkCount,
    last_indulge_feeling: lastFeeling,
  };

  const fallback = { text: 'Solid baseline today. Log as you go.' };
  const pj = await callClaudeJSON(
    `You are writing today's "Pulse" for a body-signal tracking app. ONE sentence, tight, imperative, Course's clipped voice. Wrap ONE load-bearing phrase in <em>…</em> for italic emphasis (a directive or the key observation). No preamble. No emoji. No second sentence. Max 18 words.\n\nData: ${JSON.stringify(ctx)}\n\nReturn JSON: {"text": "..."}`,
    fallback
  );
  const text = pj.text || fallback.text;
  setCachedPulse(text);
  return text;
}

// ---------------------------------------------------------------------------
// Pace logic
// ---------------------------------------------------------------------------
function computePace(drinks) {
  if (drinks.length === 0) return { perHour: 0, status: 'none', minSinceLast: null };
  const now = Date.now();
  const start = new Date(drinks[0].drink_at).getTime();
  const elapsedHr = Math.max((now - start) / 3600000, 0.25); // floor at 15min so we don't divide by tiny numbers
  const total = drinks.reduce((s, d) => s + (Number(d.standard_units) || 1), 0);
  const perHour = total / elapsedHr;
  const last = new Date(drinks[drinks.length - 1].drink_at).getTime();
  const minSinceLast = Math.floor((now - last) / 60000);
  let status = 'good';
  if (perHour >= 2.5) status = 'fast';
  else if (perHour >= 1.5) status = 'moderate';
  else status = 'easy';
  return { perHour, status, minSinceLast, total };
}

// Widmark BAC estimate. Inaccurate by ~20% — for awareness, not legal/medical decisions.
function computeBAC(drinks, profile) {
  if (!profile || drinks.length === 0) return null;
  const { age, gender, weight_lb } = profile;
  const baseR = gender === 'female' ? 0.55 : 0.68;
  const floorR = gender === 'female' ? 0.45 : 0.58;
  const r = Math.max(floorR, baseR - Math.max(0, age - 30) * 0.001);
  const grams = drinks.reduce((s, d) => s + (Number(d.standard_units) || 1) * 14, 0);
  const weightG = weight_lb * 453.592;
  const firstDrink = new Date(drinks[0].drink_at).getTime();
  const hoursElapsed = Math.max(0, (Date.now() - firstDrink) / 3600000);
  const rawBac = (grams / (weightG * r)) * 100;
  const bac = Math.max(0, rawBac - 0.015 * hoursElapsed);
  const soberInHours = bac / 0.015;
  let status = 'safe';
  if (bac >= 0.08) status = 'over';
  else if (bac >= 0.05) status = 'high';
  else if (bac >= 0.02) status = 'moderate';
  return { bac, status, soberInHours };
}

function renderPulseStatGrid() {
  const o   = state.ouraToday || {};
  const avg = sevenDayAverages(state.oura7d || []);
  const hyd = hydrationStats();

  const readiness = o.readiness_score;
  const readinessClass = (() => {
    if (readiness == null) return '';
    if (readiness >= 80) return 'readiness-good';
    if (readiness >= 65) return 'readiness-amber';
    return 'readiness-warn';
  })();

  const readinessDelta = (readiness != null && avg.readiness != null)
    ? deltaSpan(readiness - avg.readiness, '')
    : '<span class="stat-delta flat">—</span>';

  const sleepMin = o.total_sleep_min;
  const sleepValueHtml = sleepMin != null
    ? `${Math.floor(sleepMin / 60)}<span class="stat-unit">h</span> ${String(sleepMin % 60).padStart(2, '0')}<span class="stat-unit">m</span>`
    : `<span class="stat-value dim">—</span>`;
  const sleepDelta = (sleepMin != null && avg.sleep_min != null)
    ? sleepDeltaSpan(sleepMin - avg.sleep_min)
    : '<span class="stat-delta flat">—</span>';

  const hrv = o.hrv_avg;
  const hrvValueHtml = hrv != null ? `${hrv}<span class="stat-unit">ms</span>` : `<span class="stat-value dim">—</span>`;
  const hrvDelta = (hrv != null && avg.hrv != null)
    ? deltaSpan(hrv - avg.hrv, '')
    : '<span class="stat-delta flat">—</span>';

  // Hydration cell
  let hydValueHtml, hydDeltaHtml;
  if (hyd.actualMl >= 1000) {
    hydValueHtml = `${(hyd.actualMl / 1000).toFixed(1)}<span class="stat-unit">L</span>`;
  } else {
    hydValueHtml = `${hyd.actualMl}<span class="stat-unit">ml</span>`;
  }
  if (hyd.status === 'behind') {
    hydDeltaHtml = `<span class="stat-delta warn">behind ${Math.abs(hyd.delta)}ml</span>`;
  } else if (hyd.status === 'ahead') {
    hydDeltaHtml = `<span class="stat-delta up">ahead ${hyd.delta}ml</span>`;
  } else if (hyd.status === 'idle') {
    hydDeltaHtml = `<span class="stat-delta flat">starting the day</span>`;
  } else {
    hydDeltaHtml = `<span class="stat-delta flat">on pace</span>`;
  }

  return `
    <div class="stat-grid">
      <div class="stat-cell ${readinessClass}">
        <div class="stat-label">Readiness</div>
        <div class="stat-value">${readiness != null ? readiness : '—'}</div>
        ${readinessDelta}
      </div>
      <div class="stat-cell">
        <div class="stat-label">Sleep</div>
        <div class="stat-value">${sleepValueHtml}</div>
        ${sleepDelta}
      </div>
      <div class="stat-cell">
        <div class="stat-label">HRV</div>
        <div class="stat-value">${hrvValueHtml}</div>
        ${hrvDelta}
      </div>
      <div class="stat-cell">
        <div class="stat-label">Hydration</div>
        <div class="stat-value">${hydValueHtml}</div>
        ${hydDeltaHtml}
      </div>
    </div>
  `;
}

function sevenDayAverages(rows) {
  return {
    readiness: average(rows.map(r => r.readiness_score)),
    sleep_min: average(rows.map(r => r.total_sleep_min)),
    hrv:       average(rows.map(r => r.hrv_avg)),
  };
}

function deltaSpan(diff, suffix) {
  if (diff == null || !Number.isFinite(diff)) return '<span class="stat-delta flat">—</span>';
  const rounded = Math.round(diff);
  if (Math.abs(rounded) < 1) return '<span class="stat-delta flat">flat vs avg</span>';
  const sign = rounded > 0 ? '+' : '−';
  const cls = rounded > 0 ? 'up' : 'down';
  return `<span class="stat-delta ${cls}">${sign}${Math.abs(rounded)}${suffix} vs avg</span>`;
}

function sleepDeltaSpan(diffMin) {
  if (diffMin == null || !Number.isFinite(diffMin)) return '<span class="stat-delta flat">—</span>';
  const abs = Math.abs(diffMin);
  if (abs < 6) return '<span class="stat-delta flat">flat vs avg</span>';
  const sign = diffMin > 0 ? '+' : '−';
  const cls = diffMin > 0 ? 'up' : 'down';
  const lbl = abs >= 60 ? `${Math.floor(abs / 60)}h ${abs % 60}m` : `${abs}m`;
  return `<span class="stat-delta ${cls}">${sign}${lbl} vs avg</span>`;
}

// ---------------------------------------------------------------------------
// Reflection prompt card — surfaces when a session ended 6-36hr ago has no
// reflection yet. Dashed warm-bg card with × (permanent), Not now (today),
// and Reflect (opens the morning reflection sheet).
// ---------------------------------------------------------------------------
const REFLECT_DISMISS_KEY = 'tide_reflect_dismissed';
const REFLECT_NOTNOW_KEY  = 'tide_reflect_notnow';

function getReflectDismissed() {
  try { return new Set(JSON.parse(localStorage.getItem(REFLECT_DISMISS_KEY) || '[]')); }
  catch { return new Set(); }
}
function addReflectDismiss(id) {
  const set = getReflectDismissed();
  set.add(id);
  localStorage.setItem(REFLECT_DISMISS_KEY, JSON.stringify([...set]));
}

function getReflectNotNow() {
  try {
    const raw = JSON.parse(localStorage.getItem(REFLECT_NOTNOW_KEY) || '{}');
    if (raw.date !== todayISO()) return new Set();
    return new Set(raw.ids || []);
  } catch { return new Set(); }
}
function addReflectNotNow(id) {
  const set = getReflectNotNow();
  set.add(id);
  localStorage.setItem(REFLECT_NOTNOW_KEY, JSON.stringify({ date: todayISO(), ids: [...set] }));
}

function findPendingReflection() {
  if (!state.history || state.activeSession) return null;
  const dismissed = getReflectDismissed();
  const notNow = getReflectNotNow();
  return state.history.find(s =>
    s.morning_pending && !dismissed.has(s.id) && !notNow.has(s.id)
  ) || null;
}

// BAC trend: compare current BAC to what we'd compute 15 minutes ago.
// Returns "trending up" / "trending down" / "holding" / etc.
function computeBacTrend(drinks, profile, currentBac) {
  if (!profile || !drinks.length || currentBac == null) return '';
  // Re-run BAC with all drinks logged in the last 15min REMOVED to model the past state.
  const past = drinks.filter(d => {
    const t = new Date(d.entry_at || d.drink_at).getTime();
    return Date.now() - t > 15 * 60 * 1000;
  });
  if (!past.length) return 'first read';
  const pastBac = computeBAC(past, profile);
  if (!pastBac) return 'first read';
  const delta = currentBac - pastBac.bac;
  if (delta > 0.005) return 'trending up';
  if (delta < -0.005) return 'trending down';
  return 'holding';
}

const SIP_BAR_HOURS = 12;     // 12 buckets, two-hour windows from 6am → 8pm
const SIP_BAR_START_HR = 6;
const SIP_BAR_BUCKET_HR = 1.2; // 12 buckets over 14.4 hours feels about right

function dateSubLabel(d = new Date()) {
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).replace(/,/g, ' ·');
}

function sipBuckets(rows, valueKey = 'quantity') {
  // 12 buckets starting at 6am, each ~1.2h wide.
  const buckets = new Array(SIP_BAR_HOURS).fill(0);
  const now = new Date();
  const nowHr = now.getHours() + now.getMinutes() / 60;
  const nowBucket = Math.min(SIP_BAR_HOURS - 1, Math.max(0, Math.floor((nowHr - SIP_BAR_START_HR) / SIP_BAR_BUCKET_HR)));
  rows.forEach(r => {
    const d = new Date(r.logged_at);
    const hr = d.getHours() + d.getMinutes() / 60;
    const idx = Math.floor((hr - SIP_BAR_START_HR) / SIP_BAR_BUCKET_HR);
    if (idx >= 0 && idx < SIP_BAR_HOURS) buckets[idx] += (Number(r[valueKey]) || 0);
  });
  return { buckets, nowBucket };
}

function renderSipBars(rows, valueKey, maxSuggested) {
  const { buckets, nowBucket } = sipBuckets(rows, valueKey);
  const max = Math.max(maxSuggested, ...buckets, 1);
  const bars = buckets.map((v, i) => {
    const pct = Math.round((v / max) * 100);
    const cls = i === nowBucket ? 'now' : (v > 0 ? 'filled' : '');
    return `<div class="v2-bar ${cls}" style="height: ${Math.max(pct, v > 0 ? 6 : 6)}%"></div>`;
  }).join('');
  return `
    <div class="bars-row">${bars}</div>
    <div class="bars-time-row">
      <span>6a</span><span></span><span>10a</span><span></span><span>2p</span><span></span><span>6p</span><span></span><span>10p</span>
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Stack tab (v2 chunk 4) — three groups + per-item streak + full-stack streak
// ---------------------------------------------------------------------------
function stackItemStreak(itemId) {
  // Consecutive days, counting back from today (or yesterday if today not logged),
  // where this item has at least one tide_stack_logs row.
  const dates = new Set((state.stackLogs || []).filter(l => l.stack_item_id === itemId).map(l => l.log_date));
  if (!dates.size) return 0;
  const today = todayISO();
  // If today logged → start at today; else start at yesterday
  let cursor = dates.has(today) ? today : addDays(today, -1);
  let streak = 0;
  while (dates.has(cursor)) {
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}

function fullStackStreak() {
  // Number of consecutive days where every REQUIRED active item has at least one log.
  // Required is opt-in per item — if nothing is marked required, no streak fires.
  // Skip as_needed since they're legacy/hidden in v2.
  const required = (state.stackItems || []).filter(s => s.required && s.schedule !== 'as_needed');
  if (!required.length) return 0;
  const requiredIds = required.map(s => s.id);
  // Group logs by date → Set of stack_item_ids
  const byDate = {};
  (state.stackLogs || []).forEach(l => {
    if (!byDate[l.log_date]) byDate[l.log_date] = new Set();
    byDate[l.log_date].add(l.stack_item_id);
  });
  const hitAll = (date) => requiredIds.every(id => byDate[date] && byDate[date].has(id));
  const today = todayISO();
  let cursor = hitAll(today) ? today : addDays(today, -1);
  let streak = 0;
  while (hitDayExists(cursor) && hitAll(cursor)) {
    streak++;
    cursor = addDays(cursor, -1);
  }
  return streak;
}
function hitDayExists(date) {
  // Safety floor — never count back beyond the load window of stackLogs (60d).
  const earliest = addDays(todayISO(), -60);
  return date >= earliest;
}

function renderStackTab() {
  const items = state.stackItems || [];
  const today = todayISO();

      .filter(l => l.log_date === today)

  );

  const morning   = items.filter(s => s.schedule === 'morning');
  const afternoon = items.filter(s => s.schedule === 'afternoon');
  const evening   = items.filter(s => s.schedule === 'evening');
  // as_needed rows still exist in the DB for legacy items; we just don't render them.

  const scheduledItems = [...morning, ...afternoon, ...evening];
  const requiredScheduled = scheduledItems.filter(s => s.required);
  const requiredDone = requiredScheduled.filter(s => takenSet.has(s.id)).length;
  // Fall back to all scheduled when nothing is marked required, so the count
  // is never empty on first run.
  const progressDenom = requiredScheduled.length || scheduledItems.length;
  const progressNum   = requiredScheduled.length
    ? requiredDone
    : scheduledItems.filter(s => takenSet.has(s.id)).length;
  const progressLabel = requiredScheduled.length ? 'Required today' : 'Today';
  const fullStreak = fullStackStreak();
  const morningDone   = morning.filter(s => takenSet.has(s.id)).length;
  const afternoonDone = afternoon.filter(s => takenSet.has(s.id)).length;
  const eveningDone   = evening.filter(s => takenSet.has(s.id)).length;

  $('#app').innerHTML = `

      ${fullStreak > 0 ? `

          <div class="stack-streak-label">Required streak</div>

    </div>

    ${renderStackGroup('Morning', morning, takenSet, morningDone, 'morning')}

    ${items.length === 0 ? `
      <div class="card" style="margin-top: 14px">
        <p class="small" style="margin: 0">No stack items yet. Tap a <strong>+ Add</strong> button below, or open <strong>Manage</strong> in the header.</p>

    ` : ''}

    <button class="quick-fab" id="any-fab" aria-label="Log anything">+</button>
  `;

  $('[data-brand]')?.addEventListener('click', () => { state.tab = null; render(); });
  $('#any-fab').onclick = openLogAny;
  $('#stack-manage')?.addEventListener('click', () => openManageSupplements());
  $$('[data-stack-toggle]').forEach(c => c.onclick = () => toggleStackItem(c.dataset.stackToggle));
  $$('[data-asneeded-log]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    logAsNeeded(b.dataset.asneededLog);
  });
  $$('[data-add-to]').forEach(b => b.onclick = () => openManageSupplements(b.dataset.addTo, true));

    if (otherLog) otherLog.onclick = openLogOther;

    if (otherAliases) otherAliases.onclick = openManageAliases;

function renderWaterTab() {
  const todayWater = state.todayIntake.filter(r => r.category === 'water');

  const pct = Math.min(100, Math.round((totalMl / WATER_GOAL_ML) * 100));
  const met = totalMl >= WATER_GOAL_ML;

  const target = waterPaceTarget();
  const tickPct = Math.min(100, Math.round((target / WATER_GOAL_ML) * 100));
  const diff = totalMl - target; // positive = ahead, negative = behind
  let paceLabel = '';
  let fillMod = '';
  if (target === 0) {
    paceLabel = 'Day not started';
  } else if (met) {
    paceLabel = 'Goal hit';

    paceLabel = 'On pace';

  return `

        </div>
      </div>
      <div class="goal-bar">
        <div class="fill ${met ? 'met' : fillMod}" style="width: ${pct}%"></div>
        ${target > 0 && !met ? `<div class="pace-tick" style="left: ${tickPct}%"></div>` : ''}

// Compute weekly stats from history (calendar week starting Sunday)
function renderWeekSummary() {
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay()); // getDay: Sun=0
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  const isFuture = days.map(d => d > today);
  const dayCounts = days.map((d, i) => {
    if (isFuture[i]) return 0;
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const sessions = state.history.filter(s => {
      const sd = new Date(s.started_at);
      return sd >= d && sd < next;
    });
    return sessions.reduce((sum, s) => sum + (s.drink_count || 0), 0);
  });
  const max = Math.max(1, ...dayCounts);
  const total = dayCounts.reduce((a, b) => a + b, 0);
  const noDrinkDays = dayCounts.filter((c, i) => !isFuture[i] && c === 0).length;

  return `
    <div class="card">
      <h3>This week</h3>
      <div class="week-bar">
        ${dayCounts.map((c, i) => {
          const future = isFuture[i];
          const cls = future ? 'future' : (c === 0 ? 'zero' : '');
          const h = future ? 2 : (c === 0 ? 4 : Math.round(c / max * 70));
          return `
            <div class="bar">
              <div class="bar-fill ${cls}" style="height: ${h}px"></div>
              <div class="bar-label${future ? ' future' : ''}">${'SMTWTFS'[days[i].getDay()]}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="row small muted" style="margin-top: 6px">
        <div>${total} ${total === 1 ? 'drink' : 'drinks'} this week</div>
        ${noDrinkDays > 0 ? `<div class="pill pill-good">${noDrinkDays} low/no-drink ${noDrinkDays === 1 ? 'night' : 'nights'}</div>` : ''}
      </div>
    </div>
  `;
}

    if (!sel.activity) { toast('Pick an activity level'); return; }
    setProfile({ age, gender: sel.gender, weight_lb, height_in, activity_level: sel.activity });
    toast('Profile saved');
    state.screen = 'home';
    render();
  };

  $('#oura-save').onclick = () => {
    const v = $('#oura-pat-input').value.trim();
    setOuraPat(v);
    $('#oura-status').textContent = v ? 'Token saved. Sync starting…' : 'Token cleared.';
    if (v) {
      localStorage.removeItem('tide_oura_last_sync');
      syncOura({ force: true }).then(async r => {
        if (r.ok) {
          await loadOuraToday();
          $('#oura-status').textContent = `Synced ${r.count ?? 0} days.`;
        } else {
          $('#oura-status').textContent = 'Sync failed: ' + (r.error || 'unknown');
        }
      });
    } else {
      state.ouraToday = null;
    }
  };

  $('#oura-sync').onclick = async () => {
    if (!getOuraPat()) { toast('Save a PAT first'); return; }
    $('#oura-status').textContent = 'Syncing…';
    const r = await syncOura({ force: true });
    if (r.ok) {
      await loadOuraToday();
      $('#oura-status').textContent = `Synced ${r.count ?? 0} days.`;
    } else {
      $('#oura-status').textContent = 'Sync failed: ' + (r.error || 'unknown');
    }
  };
}

function showModal(innerHtml, afterInsert) {
  closeModal();
  const m = el(`<div class="modal-backdrop"><div class="modal">${innerHtml}</div></div>`);
  document.body.appendChild(m);
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });

  if (afterInsert) afterInsert(m);
}

    m.querySelectorAll('[data-type]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-type]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); sel.drink_type = c.dataset.type;

      if (sel.drink_type === 'cocktail') {

        toast('Could not log: ' + e.message);
        $('#log-go').disabled = false; $('#log-go').textContent = 'Log drink';
      }
    };

async function estimateMealKcal(type, note) {
  const prompt = `Estimate total calories for this meal. Reply ONLY as JSON: {"kcal": <integer>}.
Meal type: ${type}
Description: ${note}

Be realistic — a typical portion as described. If multiple items, sum them. Round to nearest 10.`;
  const fallback = { kcal: MEAL_DEFAULTS[type] || 400 };
  const result = await callClaudeJSON(prompt, fallback);
  const k = parseInt(result.kcal, 10);
  return (Number.isFinite(k) && k > 0 && k < 5000) ? k : fallback.kcal;
}

function openLogFood() {
  showModal(`
    <h2>Log a meal</h2>
    <div class="modal-section">
      <div class="label">Type</div>
      <div class="grid-4">
        ${MEAL_TYPES.map(t => `<div class="chip" data-meal="${t}" style="text-transform: capitalize">${t}</div>`).join('')}
      </div>
    </div>
    <div class="modal-section">
      <div class="label">What did you have</div>
      <textarea id="meal-note" rows="2" placeholder="2 eggs, toast, a coffee"></textarea>
    </div>
    <div class="modal-section">
      <div class="label">Calories</div>
      <div class="row" style="gap: 8px">
        <input id="meal-kcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="—" style="flex: 1">
        <button class="nav-btn" id="meal-estimate" disabled style="opacity: 0.5">Estimate</button>
      </div>
      <div class="small muted" style="margin-top: 6px">Pick a meal type for a default; tap Estimate to ask AI based on your note.</div>
    </div>
    <button class="btn" id="meal-go" disabled style="opacity: 0.5">Log</button>
  `, (m) => {
    let type = null;
    const kcalInput = $('#meal-kcal');
    const noteInput = $('#meal-note');
    const estBtn = $('#meal-estimate');

    const refreshEstBtn = () => {
      const ok = !!type && noteInput.value.trim().length >= 3;
      estBtn.disabled = !ok; estBtn.style.opacity = ok ? 1 : 0.5;
    };
    const refreshGoBtn = () => {
      const ok = !!type;
      $('#meal-go').disabled = !ok; $('#meal-go').style.opacity = ok ? 1 : 0.5;
    };

    m.querySelectorAll('[data-meal]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-meal]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); type = c.dataset.meal;
      if (!kcalInput.value) kcalInput.value = MEAL_DEFAULTS[type];
      refreshEstBtn(); refreshGoBtn();
    });
    noteInput.oninput = refreshEstBtn;

    estBtn.onclick = async () => {
      const note = noteInput.value.trim();
      if (!type || note.length < 3) return;
      estBtn.disabled = true; estBtn.textContent = '…';
      try {
        const k = await estimateMealKcal(type, note);
        kcalInput.value = k;
        toast('Estimated by AI — edit if needed');
      } catch (e) {
        toast('Estimate failed — using default');
        kcalInput.value = MEAL_DEFAULTS[type];
      } finally {
        estBtn.textContent = 'Estimate';
        refreshEstBtn();
      }
    };

    $('#meal-go').onclick = async () => {
      if (!type) return;
      $('#meal-go').disabled = true; $('#meal-go').textContent = 'Logging…';
      try {
        const kcal = parseInt(kcalInput.value, 10) || MEAL_DEFAULTS[type];
        await logFood(type, noteInput.value.trim() || null, kcal);
        closeModal();
      } catch (e) {
        toast('Could not log: ' + e.message);
        $('#meal-go').disabled = false; $('#meal-go').textContent = 'Log';
      }
    };
  });
}

  // De-duplicated history names for the datalist (most recently used first).

  (state.allStackItems || []).slice().reverse().forEach(s => {
    const key = (s.name || '').trim();
    if (key && !seenNames.has(key.toLowerCase())) {
      seenNames.add(key.toLowerCase());
      historyNames.push(key);

  });
  showModal(`
    <h2>${addOnly ? `Add to ${escapeHtml(sectionLabel || 'stack')}` : 'Your stack'}</h2>
    ${addOnly ? '' : `<div id="supp-list">${(state.stackItems || []).length ? renderRows() : '<div class="muted small" style="margin-bottom: 14px">No items yet.</div>'}</div>`}

    <div class="modal-section">
      ${addOnly ? '' : '<div class="label">Add</div>'}
      <input id="supp-name" type="text" placeholder="e.g., magnesium glycinate" autocomplete="off" list="supp-name-history">
      <datalist id="supp-name-history">
        ${historyNames.map(n => `<option value="${escapeHtml(n)}"></option>`).join('')}
      </datalist>
      <input id="supp-dose" type="text" placeholder="dose (e.g., 300mg, optional)" autocomplete="off" style="margin-top: 8px">
      ${addOnly ? '' : `
        <div class="grid-3" style="margin-top: 8px">
          ${SUPP_TIMINGS.map(t => `<div class="chip" data-timing="${t}" style="text-transform: capitalize">${t.replace('_', ' ')}</div>`).join('')}
        </div>
      `}
      <div class="grid-2" style="margin-top: 8px">
        <div class="chip selected" data-category="supplement">Supplement</div>
        <div class="chip" data-category="medication">Medication</div>
      </div>
      <div class="grid-2" style="margin-top: 8px">
        <div class="chip" data-required-toggle="1">Required daily</div>
        <div class="chip selected" data-required-toggle="0">Optional</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-soft" data-close>Done</button>

    let required = false;

    if (preselectSchedule) {
      const pre = m.querySelector(`[data-timing="${preselectSchedule}"]`);
      if (pre) pre.classList.add('selected');
      // Scroll the Add section into view so the user lands there.

      const ok = !!name && !!timing;
      $('#supp-add').disabled = !ok; $('#supp-add').style.opacity = ok ? 1 : 0.5;
    };
    const applyHistoryMatch = () => {
      const match = findStackHistoryMatch($('#supp-name').value);
      if (!match) return;
      // Only autofill fields the user hasn't edited yet (don't clobber typed dose).
      if (!$('#supp-dose').value && match.dose) $('#supp-dose').value = match.dose;
      // Schedule: respect preselect if caller set one; else use history's schedule
      if (!timing && match.schedule) {
        timing = match.schedule;
        m.querySelectorAll('[data-timing]').forEach(x => x.classList.toggle('selected', x.dataset.timing === match.schedule));
      }
      // Category
      if (match.category) {
        category = match.category;
        m.querySelectorAll('[data-category]').forEach(x => x.classList.toggle('selected', x.dataset.category === match.category));
      }
      // Required
      required = !!match.required;
      m.querySelectorAll('[data-required-toggle]').forEach(x => x.classList.toggle('selected', x.dataset.requiredToggle === (match.required ? '1' : '0')));
      refreshAddBtn();
    };
    $('#supp-name').oninput = () => { refreshAddBtn(); applyHistoryMatch(); };
    $('#supp-name').onchange = applyHistoryMatch; // fires after picking from datalist
    m.querySelectorAll('[data-timing]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-timing]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); timing = c.dataset.timing;
      refreshAddBtn();
    });
    m.querySelectorAll('[data-category]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-category]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); category = c.dataset.category;
    });
    m.querySelectorAll('[data-required-toggle]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-required-toggle]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); required = c.dataset.requiredToggle === '1';
    });
    const wireRows = () => {
      if (addOnly) return;
      m.querySelectorAll('[data-supp-remove]').forEach(b => b.onclick = async () => {
        await removeSupplement(b.dataset.suppRemove);
        $('#supp-list').innerHTML = (state.stackItems || []).length ? renderRows() : '<div class="muted small" style="margin-bottom: 14px">No items yet.</div>';
        wireRows();
        render();
      });
      m.querySelectorAll('[data-supp-required]').forEach(b => b.onclick = async () => {
        const id = b.dataset.suppRequired;
        const now = b.dataset.currentlyRequired === '1';
        await updateStackItem(id, { required: !now });
        $('#supp-list').innerHTML = renderRows();
        wireRows();
        render();
      });
    };
    wireRows();
    $('#supp-add').onclick = async () => {
      const name = $('#supp-name').value.trim();
      const dose = $('#supp-dose').value.trim() || null;
      if (!name || !timing) {
        toast(!name ? 'Add a name' : 'Pick a schedule');
        return;
      }
      const btn = $('#supp-add');
      btn.disabled = true; btn.textContent = 'Adding…';
      try {
        await addSupplement(name, timing, dose, category, required);
        // Re-render the Stack page behind the modal so the new item is visible on close.
        render();
        if (addOnly) {
          // Section-local add → close the modal; user is done.
          closeModal();
          toast('Added');
          return;
        }
        // Manage flow → stay open so user can add more.
        $('#supp-name').value = ''; $('#supp-dose').value = '';
        m.querySelectorAll('[data-timing]').forEach(x => x.classList.remove('selected'));
        if (!preselectSchedule) timing = null;
        required = false;
        m.querySelectorAll('[data-required-toggle]').forEach(x => x.classList.remove('selected'));
        m.querySelector('[data-required-toggle="0"]')?.classList.add('selected');
        const list = $('#supp-list');
        if (list) list.innerHTML = renderRows();
        wireRows();
        toast('Added');
      } catch (e) {
        toast('Could not add: ' + e.message);
        console.warn('addSupplement failed:', e);
      } finally {
        btn.textContent = 'Add';
        refreshAddBtn();
      }
    };
  });
}

// Look up a name in the user's full stack history (active + inactive).
// Match is case-insensitive on trimmed name. Returns the row or null.
function findStackHistoryMatch(name) {
  const needle = (name || '').trim().toLowerCase();
  if (!needle) return null;
  return (state.allStackItems || []).find(s => (s.name || '').trim().toLowerCase() === needle) || null;
}

async function addSupplement(name, schedule, dose = null, category = 'supplement', required = false) {
  // If this name already exists, revive/update instead of creating a duplicate.
  const existing = findStackHistoryMatch(name);
  if (existing) {
    const patch = {
      schedule, dose, category, required,
      active: true,
    };
    const result = await sbFetch(`/tide_stack_items?id=eq.${existing.id}`, {
      method: 'PATCH',
      body: JSON.stringify(patch),
    });
    const updated = result && result[0];
    if (updated) {
      state.allStackItems = state.allStackItems.map(s => s.id === updated.id ? updated : s);
      state.stackItems = state.allStackItems.filter(s => s.active !== false);
      state.supplements = state.stackItems;
    }
    return updated;
  }
  const row = { name, schedule, dose, category, required, active: true };
  const result = await sbFetch('/tide_stack_items', { method: 'POST', body: JSON.stringify(row) });
  const created = result && result[0];
  if (created) {
    state.allStackItems.push(created);
    state.stackItems = state.allStackItems.filter(s => s.active !== false);
    state.supplements = state.stackItems;
  }
  return created;
}

async function removeSupplement(id) {
  // Soft delete — preserves history for autocomplete and per-item streaks.
  await sbFetch(`/tide_stack_items?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify({ active: false }) });
  state.allStackItems = state.allStackItems.map(s => s.id === id ? { ...s, active: false } : s);
  state.stackItems = state.allStackItems.filter(s => s.active !== false);
  state.supplements = state.stackItems;
}

async function updateStackItem(id, patch) {
  const result = await sbFetch(`/tide_stack_items?id=eq.${id}`, {
    method: 'PATCH',
    body: JSON.stringify(patch),
  });
  const updated = result && result[0];
  if (updated) {
    state.allStackItems = (state.allStackItems || []).map(s => s.id === id ? updated : s);
    state.stackItems = state.allStackItems.filter(s => s.active !== false);
    state.supplements = state.stackItems;
  }
  return updated;
}

// Patterns — joins tide_oura_daily with sessions/drinks to surface comparisons
// ---------------------------------------------------------------------------
const PAT_WINDOWS = [
  { id: '7d',  days: 7,  label: '7d'  },
  { id: '30d', days: 30, label: '30d' },
  { id: '90d', days: 90, label: '90d' },
];

// A session that started after noon attributes to the Oura row for the NEXT day
// (the sleep that ended that morning). Before noon — same day.
function ouraDateForSession(startedAt) {
  const d = new Date(startedAt);
  if (d.getHours() >= 12) {
    const next = new Date(d);
    next.setDate(next.getDate() + 1);
    return next.toISOString().slice(0, 10);
  }
  return d.toISOString().slice(0, 10);
}

function drinkBucket(n) {
  if (!n) return '0';
  if (n <= 2) return '1-2';
  if (n <= 4) return '3-4';
  return '5+';
}

const BUCKET_ORDER = ['0', '1-2', '3-4', '5+'];
const BUCKET_LABELS = {
  '0':   'No drinks',
  '1-2': '1–2 drinks',
  '3-4': '3–4 drinks',
  '5+':  '5+ drinks',
};

async function loadPatternsData(days) {
  const endDate = todayISO();
  const startDate = addDays(endDate, -(days - 1));
  // Sessions over a wider window so attribution into the start date works.
  const startedAfter = addDays(startDate, -1) + 'T00:00:00';
  const [ouraRows, sessions] = await Promise.all([
    loadOuraRange(startDate, endDate),
    sbFetch(`/tide_indulge_sessions?started_at=gte.${encodeURIComponent(startedAfter)}&order=started_at.asc`).catch(() => []),
  ]);
  const sessIds = (sessions || []).map(s => s.id);
  let drinkCounts = {};
  if (sessIds.length) {
    const entries = await sbFetch(`/tide_indulge_entries?session_id=in.(${sessIds.join(',')})&kind=eq.alcohol&select=session_id`).catch(() => []);
    (entries || []).forEach(d => { drinkCounts[d.session_id] = (drinkCounts[d.session_id] || 0) + 1; });
  }
  // Map oura_date → drink count (summed if multiple sessions land on same night)
  const drinksByOuraDate = {};
  (sessions || []).forEach(s => {
    const od = ouraDateForSession(s.started_at);
    drinksByOuraDate[od] = (drinksByOuraDate[od] || 0) + (drinkCounts[s.id] || 0);
  });
  // Build a row per oura date with metric + bucket
  const joined = (ouraRows || []).map(o => ({
    date: o.date,
    sleep_score: o.sleep_score,
    hrv_avg: o.hrv_avg,
    readiness_score: o.readiness_score,
    total_sleep_min: o.total_sleep_min,
    drink_count: drinksByOuraDate[o.date] || 0,
    bucket: drinkBucket(drinksByOuraDate[o.date] || 0),
  }));
  return { joined, startDate, endDate, hadPat: !!getOuraPat() };
}

function bucketStats(rows, key) {
  const buckets = {};
  BUCKET_ORDER.forEach(b => { buckets[b] = { sum: 0, n: 0 }; });
  rows.forEach(r => {
    const v = r[key];
    if (v == null) return;
    buckets[r.bucket].sum += v;
    buckets[r.bucket].n += 1;
  });
  const out = {};
  BUCKET_ORDER.forEach(b => {
    out[b] = buckets[b].n ? buckets[b].sum / buckets[b].n : null;
  });
  return out;
}

function patBar(label, value, max, fmt, n) {
  if (value == null) {
    return `<div class="pat-row"><div class="pat-row-label">${escapeHtml(label)}</div><div class="pat-row-bar dim"></div><div class="pat-row-val dim">—</div></div>`;
  }
  const pct = Math.max(0, Math.min(100, max ? (value / max) * 100 : 0));
  return `<div class="pat-row">
    <div class="pat-row-label">${escapeHtml(label)}</div>
    <div class="pat-row-bar"><div class="pat-row-fill" style="width: ${pct.toFixed(1)}%"></div></div>
    <div class="pat-row-val">${fmt(value)}${n ? `<span class="muted small" style="font-weight:400"> · ${n}</span>` : ''}</div>
  </div>`;
}

function patMetricCard(title, rows, key, max, fmt) {
  const stats = bucketStats(rows, key);
  const counts = {};
  BUCKET_ORDER.forEach(b => { counts[b] = rows.filter(r => r.bucket === b && r[key] != null).length; });
  const anyData = BUCKET_ORDER.some(b => stats[b] != null);
  if (!anyData) {
    return `<div class="card pat-card"><div class="pat-metric-title">${escapeHtml(title)}</div><div class="pat-empty">No data yet for this window.</div></div>`;
  }
  return `<div class="card pat-card">
    <div class="pat-metric-title">${escapeHtml(title)}</div>
    ${BUCKET_ORDER.map(b => patBar(BUCKET_LABELS[b], stats[b], max, fmt, counts[b])).join('')}
  </div>`;
}

async function patternsNarrative(days, joined) {
  if (!joined.length) return 'Sync Oura and log some sessions — patterns appear here once there is data on both sides.';
  const summary = joined
    .filter(r => r.sleep_score != null || r.hrv_avg != null || r.readiness_score != null)
    .map(r => ({
      d: r.date,
      drinks: r.drink_count,
      sleep: r.sleep_score,
      hrv: r.hrv_avg,
      readiness: r.readiness_score,
      sleep_min: r.total_sleep_min,
    }));
  if (summary.length < 3) return 'Not enough joined data yet — keep logging and the pattern will fill in.';
  const fallback = { paragraph: 'Not enough signal to call a pattern yet.' };
  const pj = await callClaudeJSON(
    `You're analyzing ${days} days of someone's drinking + Oura biometrics. Each row is one day: drinks (count for the night before), sleep score, HRV balance, readiness score, total sleep minutes. Identify 1–3 specific, concrete patterns relating drinking to recovery. Be terse, non-judgmental, factual. Cite numbers. Max 80 words. If the signal is weak, say so. Return JSON: {"paragraph": "..."}\n\nData: ${JSON.stringify(summary)}`,
    fallback
  );
  return pj.paragraph || fallback.paragraph;
}

async function renderPatterns() {
  const win = state.patternsWindow || '30d';
  const winCfg = PAT_WINDOWS.find(w => w.id === win) || PAT_WINDOWS[1];

  // Initial frame with loading state
  $('#app').innerHTML = `
    <header class="app-head">
      <button class="nav-btn" data-back>← Back</button>
