async function sbFetch(path, opts = {}) {
  const url = path.startsWith('http') ? path : `${SB_URL}/rest/v1${path}`;
  const r = await fetch(url, {
    ...opts,
    headers: {
      apikey: SB_KEY,
      Authorization: `Bearer ${SB_KEY}`,
      'Content-Type': 'application/json',
      Prefer: opts.method === 'POST' ? 'return=representation' : (opts.method === 'PATCH' ? 'return=representation' : ''),
      ...(opts.headers || {}),
    },
  });
  if (!r.ok) {
    const txt = await r.text();
    throw new Error(`Supabase ${r.status}: ${txt}`);
  }
  if (r.status === 204) return null;
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

async function callClaude(userPrompt, { system = null, maxTokens = 400 } = {}) {
  const key = getKey();
  if (!key) throw new Error('No API key set');
  const body = {
    model: CLAUDE_MODEL,
    max_tokens: maxTokens,
    messages: [{ role: 'user', content: userPrompt }],
  };
  if (system) body.system = system;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(`Claude ${r.status}: ${t.slice(0, 200)}`);
  }
  const data = await r.json();
  return (data.content || []).map(c => c.text || '').join('').trim();
}

// ---------------------------------------------------------------------------
// Pace logic
// ---------------------------------------------------------------------------
function computePace(drinks) {
  if (drinks.length === 0) return { perHour: 0, status: 'none', minSinceLast: null };
  const now = Date.now();
  const start = new Date(drinks[0].drink_at).getTime();
  const elapsedHr = Math.max((now - start) / 3600000, 0.25); // floor at 15min so we don't divide by tiny numbers
  const total = drinks.reduce((s, d) => s + (Number(d.standard_units) || 1), 0);
  const perHour = total / elapsedHr;
  const last = new Date(drinks[drinks.length - 1].drink_at).getTime();
  const minSinceLast = Math.floor((now - last) / 60000);
  let status = 'good';
  if (perHour >= 2.5) status = 'fast';
  else if (perHour >= 1.5) status = 'moderate';
  else status = 'easy';
  return { perHour, status, minSinceLast, total };
}

// Widmark BAC estimate. Inaccurate by ~20% — for awareness, not legal/medical decisions.
function computeBAC(drinks, profile) {
  if (!profile || drinks.length === 0) return null;
  const { age, gender, weight_lb } = profile;
  const baseR = gender === 'female' ? 0.55 : 0.68;
  const floorR = gender === 'female' ? 0.45 : 0.58;
  const r = Math.max(floorR, baseR - Math.max(0, age - 30) * 0.001);
  const grams = drinks.reduce((s, d) => s + (Number(d.standard_units) || 1) * 14, 0);
  const weightG = weight_lb * 453.592;
  const firstDrink = new Date(drinks[0].drink_at).getTime();
  const hoursElapsed = Math.max(0, (Date.now() - firstDrink) / 3600000);
  const rawBac = (grams / (weightG * r)) * 100;
  const bac = Math.max(0, rawBac - 0.015 * hoursElapsed);
  const soberInHours = bac / 0.015;
  let status = 'safe';
  if (bac >= 0.08) status = 'over';
  else if (bac >= 0.05) status = 'high';
  else if (bac >= 0.02) status = 'moderate';
  return { bac, status, soberInHours };
}

function renderHome() {

    { id: 'water',       label: 'Water' },
    { id: 'food',        label: 'Food' },
    { id: 'supplements', label: 'Supps' },

function renderTabContent(tab) {
  if (tab === 'drinks') {
    const hasSession = !!state.activeSession;
    const pace = hasSession ? computePace(state.drinks) : null;
    const elapsed = hasSession ? Date.now() - new Date(state.activeSession.started_at).getTime() : 0;
    return `
      ${hasSession ? renderActiveSessionCard(pace, elapsed) : renderIdleCard()}
      ${hasSession ? renderDrinkList() : renderWeekSummary()}
      ${renderCaffeineSection()}
      ${renderOtherSection()}
    `;
  }
  if (tab === 'water') return renderWaterTab();
  if (tab === 'food') return renderFoodTab();
  if (tab === 'supplements') return renderSupplementsTab();
  return '';
}

function wireTabEvents(tab) {

function renderWaterTab() {
  const todayWater = state.todayIntake.filter(r => r.category === 'water');
  const totalMl = todayWater.reduce((s, r) => s + (Number(r.quantity) || 0), 0);
  const pct = Math.min(100, Math.round((totalMl / WATER_GOAL_ML) * 100));
  const met = totalMl >= WATER_GOAL_ML;

  const target = waterPaceTarget();
  const tickPct = Math.min(100, Math.round((target / WATER_GOAL_ML) * 100));
  const diff = totalMl - target; // positive = ahead, negative = behind
  let paceLabel = '';
  let fillMod = '';
  if (target === 0) {
    paceLabel = 'Day not started';
  } else if (met) {
    paceLabel = 'Goal hit';
  } else if (Math.abs(diff) < 100) {
    paceLabel = 'On pace';

    paceLabel = `${diff} ml ahead`;

    paceLabel = `${-diff} ml behind`;

  }

  return `
    <div class="card">
      <div class="row" style="margin-bottom: 4px">
        <div class="stack">
          <div class="muted small">Today</div>

        </div>
        <div class="stack" style="text-align: right">
          <div class="muted small">goal ${WATER_GOAL_ML} ml</div>

        </div>

      <div class="goal-bar">
        <div class="fill ${met ? 'met' : fillMod}" style="width: ${pct}%"></div>

            <div class="intake-item">

              <div class="muted small">${fmtTime(r.logged_at)} <span class="x" data-undo-intake="${r.id}" role="button" aria-label="Undo">×</span></div>

// Compute weekly stats from history (calendar week starting Sunday)
function renderWeekSummary() {
  const now = new Date();
  const today = new Date(now); today.setHours(0, 0, 0, 0);
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - today.getDay()); // getDay: Sun=0
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(sunday);
    d.setDate(sunday.getDate() + i);
    days.push(d);
  }
  const isFuture = days.map(d => d > today);
  const dayCounts = days.map((d, i) => {
    if (isFuture[i]) return 0;
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const sessions = state.history.filter(s => {
      const sd = new Date(s.started_at);
      return sd >= d && sd < next;
    });
    return sessions.reduce((sum, s) => sum + (s.drink_count || 0), 0);
  });
  const max = Math.max(1, ...dayCounts);
  const total = dayCounts.reduce((a, b) => a + b, 0);
  const noDrinkDays = dayCounts.filter((c, i) => !isFuture[i] && c === 0).length;

  return `
    <div class="card">
      <h3>This week</h3>
      <div class="week-bar">
        ${dayCounts.map((c, i) => {
          const future = isFuture[i];
          const cls = future ? 'future' : (c === 0 ? 'zero' : '');
          const h = future ? 2 : (c === 0 ? 4 : Math.round(c / max * 70));
          return `
            <div class="bar">
              <div class="bar-fill ${cls}" style="height: ${h}px"></div>
              <div class="bar-label${future ? ' future' : ''}">${'SMTWTFS'[days[i].getDay()]}</div>
            </div>
          `;
        }).join('')}
      </div>
      <div class="row small muted" style="margin-top: 6px">
        <div>${total} ${total === 1 ? 'drink' : 'drinks'} this week</div>
        ${noDrinkDays > 0 ? `<div class="pill pill-good">${noDrinkDays} low/no-drink ${noDrinkDays === 1 ? 'night' : 'nights'}</div>` : ''}
      </div>
    </div>
  `;
}

function showModal(innerHtml, afterInsert) {
  closeModal();
  const m = el(`<div class="modal-backdrop"><div class="modal">${innerHtml}</div></div>`);
  document.body.appendChild(m);

async function estimateMealKcal(type, note) {
  const prompt = `Estimate total calories for this meal. Reply ONLY as JSON: {"kcal": <integer>}.
Meal type: ${type}
Description: ${note}

Be realistic — a typical portion as described. If multiple items, sum them. Round to nearest 10.`;
  const fallback = { kcal: MEAL_DEFAULTS[type] || 400 };
  const result = await callClaudeJSON(prompt, fallback);
  const k = parseInt(result.kcal, 10);
  return (Number.isFinite(k) && k > 0 && k < 5000) ? k : fallback.kcal;
}

function openLogFood() {
  showModal(`
    <h2>Log a meal</h2>
    <div class="modal-section">
      <div class="label">Type</div>
      <div class="grid-4">
        ${MEAL_TYPES.map(t => `<div class="chip" data-meal="${t}" style="text-transform: capitalize">${t}</div>`).join('')}
      </div>
    </div>
    <div class="modal-section">
      <div class="label">What did you have</div>
      <textarea id="meal-note" rows="2" placeholder="2 eggs, toast, a coffee"></textarea>
    </div>
    <div class="modal-section">
      <div class="label">Calories</div>
      <div class="row" style="gap: 8px">
        <input id="meal-kcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="—" style="flex: 1">
        <button class="nav-btn" id="meal-estimate" disabled style="opacity: 0.5">Estimate</button>
      </div>
      <div class="small muted" style="margin-top: 6px">Pick a meal type for a default; tap Estimate to ask AI based on your note.</div>
    </div>
    <button class="btn" id="meal-go" disabled style="opacity: 0.5">Log</button>
  `, (m) => {
    let type = null;
    const kcalInput = $('#meal-kcal');
    const noteInput = $('#meal-note');
    const estBtn = $('#meal-estimate');

    const refreshEstBtn = () => {
      const ok = !!type && noteInput.value.trim().length >= 3;
      estBtn.disabled = !ok; estBtn.style.opacity = ok ? 1 : 0.5;
    };
    const refreshGoBtn = () => {
      const ok = !!type;
      $('#meal-go').disabled = !ok; $('#meal-go').style.opacity = ok ? 1 : 0.5;
    };

    m.querySelectorAll('[data-meal]').forEach(c => c.onclick = () => {
      m.querySelectorAll('[data-meal]').forEach(x => x.classList.remove('selected'));
      c.classList.add('selected'); type = c.dataset.meal;

      refreshEstBtn(); refreshGoBtn();
    });

    estBtn.onclick = async () => {
      const note = noteInput.value.trim();
      if (!type || note.length < 3) return;
      estBtn.disabled = true; estBtn.textContent = '…';

        const k = await estimateMealKcal(type, note);

        kcalInput.value = MEAL_DEFAULTS[type];

        refreshEstBtn();
      }
    };

    $('#meal-go').onclick = async () => {
      if (!type) return;
      $('#meal-go').disabled = true; $('#meal-go').textContent = 'Logging…';
      try {
        const kcal = parseInt(kcalInput.value, 10) || MEAL_DEFAULTS[type];

        toast('Could not log: ' + e.message);
        $('#meal-go').disabled = false; $('#meal-go').textContent = 'Log';
      }
    };
  });

async function endSession(feeling, note) {
  const ended_at = new Date().toISOString();
  const duration_min = Math.round((Date.now() - new Date(state.activeSession.started_at).getTime()) / 60000);
  const update = { ended_at, feeling, note: note || null, duration_min };
  await sbFetch(`/tide_sessions?id=eq.${state.activeSession.id}`, {
    method: 'PATCH',
    body: JSON.stringify(update),
  });
  state.activeSession = null;
  state.drinks = [];
  saveLocal();
  await loadHistory();
  render();
  toast('Session saved. Sleep well.');

    );

  } catch {}

  $('#app').innerHTML = `
    <header class="app-head">
      <button class="nav-btn" data-back>← Back</button>
      <div class="title">Morning</div>

        <div class="label">Sleep quality</div>
        <div class="grid-4">

        </div>
      </div>

        <div class="label">Note</div>
        <textarea id="morning-note" rows="4" placeholder="One thought from the morning…"></textarea>
      </div>

      <div class="modal-section">
        <label class="row" style="cursor: pointer">
          <span class="small">Push to Still as a reflection</span>
          <input type="checkbox" id="push-still" style="width: auto">

async function saveMorning(session, sleep, note, push, prompt) {
  const row = {
    session_id: session.id,
    sleep_quality: sleep,
    note: note || null,
    pushed_to_still: push,
  };
  await sbFetch('/tide_reflections', { method: 'POST', body: JSON.stringify(row) });

  if (push && note) {
    // Push to Still's reflections table — same Supabase project, same anon key
    try {
      await sbFetch('/reflections', {
        method: 'POST',
        body: JSON.stringify({
          text: note,
          mood: session.feeling || null,
          tags: ['tide', 'morning-after'],
          prompt_used: prompt,
        }),
      });
    } catch (e) {
      console.warn('Push to Still failed:', e.message);
      toast('Saved locally — Still push failed');
    }
  }
}

// ---------------------------------------------------------------------------
// Quotes — real human quotes, rotated locally. No AI generation.
// ---------------------------------------------------------------------------
function pickQuote({ preferTags = null } = {}) {
  const dismissedSet = new Set((state.dismissedQuotes || []).slice(-30));
  const currentQ = state.currentQuote ? state.currentQuote.q : null;
  const excludeQs = new Set([currentQ]);

  let pool = QUOTES.filter(x => !excludeQs.has(x.q) && !dismissedSet.has(x.q));
  if (preferTags) {
    const tagged = pool.filter(x => x.tags && x.tags.some(t => preferTags.includes(t)));
    if (tagged.length) pool = tagged;
  }
  if (pool.length === 0) {
    pool = QUOTES.filter(x => !excludeQs.has(x.q) && !dismissedSet.has(x.q));
  }
  if (pool.length === 0) {
    pool = QUOTES.filter(x => !excludeQs.has(x.q));
  }
  if (pool.length === 0) pool = QUOTES;
  return pool[Math.floor(Math.random() * pool.length)];
}

function loadQuote(force = false) {
  if (!force && state.currentQuote) return;
  state.currentQuote = pickQuote();
  if (state.screen === 'home') render();
}

async function dismissQuote() {
  if (!state.currentQuote) return;
  const dismissed = state.currentQuote.q;
  state.dismissedQuotes.push(dismissed);
  saveLocal();
  try {
    await sbFetch('/tide_dismissed_quotes', {
      method: 'POST',
      body: JSON.stringify({ quote: dismissed }),
    });
  } catch (e) { /* non-fatal */ }
  state.currentQuote = pickQuote();
  render();
}

function maybeNudge(kind) {
  const tags = kind === 'fast-pace' ? ['presence'] : ['presence', 'company'];
  state.currentQuote = pickQuote({ preferTags: tags });
  render();
}

// ---------------------------------------------------------------------------
// Local persistence (for offline-friendly active session reload)
// ---------------------------------------------------------------------------
function saveLocal() {
  localStorage.setItem('tide_state', JSON.stringify({
    activeSession: state.activeSession,
    drinks: state.drinks,
    dismissedQuotes: state.dismissedQuotes.slice(-50),
  }));
}
function loadLocal() {
  try {
    const raw = localStorage.getItem('tide_state');
    if (!raw) return;
    const s = JSON.parse(raw);
    state.activeSession = s.activeSession || null;
    state.drinks = s.drinks || [];
    state.dismissedQuotes = s.dismissedQuotes || [];
  } catch {}
}

// ---------------------------------------------------------------------------
// Data load
// ---------------------------------------------------------------------------
async function loadActiveSession() {
  // Server source of truth: last session with no ended_at
  try {
    const sessions = await sbFetch('/tide_sessions?ended_at=is.null&order=started_at.desc&limit=1');
    if (sessions && sessions.length) {
      state.activeSession = sessions[0];
      const drinks = await sbFetch(`/tide_drinks?session_id=eq.${sessions[0].id}&order=drink_at.asc`);
      state.drinks = drinks || [];
    } else {
      state.activeSession = null;
      state.drinks = [];
    }
    saveLocal();
  } catch (e) {
    console.warn('loadActiveSession failed, using local:', e.message);
    loadLocal();
  }
}

}

async function loadSupplements() {

    state.supplements = rows || [];

    state.supplements = [];

}

async function loadAliases() {

    state.aliases = rows || [];
  } catch (e) {

async function loadTodayOther() {

    state.todayOther = rows || [];
  } catch (e) {

    state.todayOther = [];
  }
}

async function loadHistory() {
  try {
    // Pull last 30 sessions with drink counts (computed via two queries — keep it simple)
    const sessions = await sbFetch('/tide_sessions?order=started_at.desc&limit=30');
    if (!sessions) { state.history = []; return; }
    // Get drink counts in one query and merge
    const ids = sessions.map(s => s.id);
    let drinks = [];
    if (ids.length) {
      drinks = await sbFetch(`/tide_drinks?session_id=in.(${ids.join(',')})&select=session_id`) || [];
    }
    const counts = {};
    drinks.forEach(d => { counts[d.session_id] = (counts[d.session_id] || 0) + 1; });

    // Fetch existing morning reflections to know what's already done
    const refls = await sbFetch(`/tide_reflections?session_id=in.(${ids.join(',')})&select=session_id`) || [];
    const reflected = new Set(refls.map(r => r.session_id));

    state.history = sessions
      .filter(s => s.ended_at) // exclude active
      .map(s => {
        const sessionDate = new Date(s.started_at);
        const hoursAgo = (Date.now() - sessionDate.getTime()) / 3600000;
        const morningWindow = hoursAgo >= 6 && hoursAgo <= 36 && !reflected.has(s.id);
        return { ...s, drink_count: counts[s.id] || 0, morning_pending: morningWindow };
      });
  } catch (e) {
    console.warn('loadHistory failed:', e.message);
    state.history = [];
  }
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
async function boot() {
  if (!getKey()) { renderKeyForm(); return; }
  loadLocal();
  // Render fast from local cache
  state.screen = 'home';
  render();
  // Then refresh from server
  await loadActiveSession();
  await loadHistory();
  await Promise.all([loadTodayIntake(), loadSupplements(), loadAliases(), loadTodayOther()]);
  // Auto-prompt morning-after if there's a recently-ended session pending
  const pending = state.history.find(s => s.morning_pending);
  if (pending && !state.activeSession && !sessionStorage.getItem('morning_dismissed_' + pending.id)) {
    sessionStorage.setItem('morning_dismissed_' + pending.id, '1');
    state.morningSession = pending;
    state.screen = 'morning';
    renderMorning(pending);
    return;
  }
  render();
}

// Service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => reg.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}

window.openLogDrink = openLogDrink;

boot();
